services:
  postgis:
    # Postgres 18 with PostGIS 3.6 preinstalled. Pinned to a tag so it
    # doesn't change under you when a newer image is published.
    image: postgis/postgis:18-3.6
    container_name: nepal-postgis # clear name, since you now have two Postgres containers
    environment:
      # Docker substitutes these from the .env file next to this one
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      # Bind strictly to localhost so database is not exposed to local network
      - "127.0.0.1:5433:5432"
    volumes:
      # Named volume so the imported data survives container removal.
      # Postgres 18+ images use /var/lib/postgresql (older ones used
      # /var/lib/postgresql/data), so don't copy older examples blindly.
      - osm_pgdata:/var/lib/postgresql
    restart: unless-stopped

  geo-data:
    build:
      context: ./services/geo-data
      dockerfile: Dockerfile
    container_name: nepal-geo-data
    ports:
      # Bind strictly to localhost
      - "127.0.0.1:8001:8001"
    environment:
      DB_HOST: nepal-postgis
      DB_PORT: 5432
      DB_NAME: ${POSTGRES_DB:-nepal_osm}
      DB_USER: ${POSTGRES_USER:-map-osm}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      DATA_AS_OF: ${DATA_AS_OF:-2026-10-29}
    depends_on:
      - postgis
    restart: unless-stopped

volumes:
  osm_pgdata:
